version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sociotools-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sociotools
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sociotools-network

  redis:
    image: redis:7-alpine
    container_name: sociotools-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - sociotools-network

volumes:
  postgres_data:
  redis_data:

networks:
  sociotools-network:
    driver: bridge
